<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI Video Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #060b14;
    color: #e0f0ff;
    font-family: 'Courier New', monospace;
    overflow-x: hidden;
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0,255,231,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,231,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #00ffe7, transparent);
    animation: scanline 4s linear infinite;
    pointer-events: none; z-index: 1; opacity: 0.3;
  }
  @keyframes scanline { 0%{transform:translateY(-10px)} 100%{transform:translateY(100vh)} }
  @keyframes glowPulse {
    0%,100%{box-shadow:0 0 20px #00ffe7aa,0 0 40px #00ffe744}
    50%{box-shadow:0 0 40px #00ffe7ff,0 0 80px #00ffe788}
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }

  .wrap { position:relative; z-index:2; max-width:860px; margin:0 auto; padding:32px 14px; }

  .badge {
    display:inline-block; border:1px solid #00ffe744; padding:4px 16px;
    border-radius:2px; font-size:10px; letter-spacing:4px; color:#00ffe7aa;
    margin-bottom:14px;
  }
  h1 {
    font-size:clamp(24px,6vw,46px); font-weight:900;
    background:linear-gradient(135deg,#00ffe7,#0080ff,#7700ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-size:200% auto; animation:shimmer 3s linear infinite;
  }
  .subtitle { color:#4a7fa5; margin-top:10px; font-size:12px; letter-spacing:2px; }

  .card {
    background:#0a1628; border:1px solid #00ffe744;
    border-radius:6px; padding:18px; margin-bottom:18px;
  }
  .card.glow { animation: glowPulse 2s ease-in-out infinite; }
  .card label { display:block; font-size:10px; letter-spacing:3px; color:#00ffe7aa; margin-bottom:10px; }

  input[type=text], input[type=password] {
    width:100%; background:#060b14; border:1px solid #00ffe733;
    border-radius:3px; padding:11px 13px; color:#e0f0ff;
    font-family:monospace; font-size:14px; outline:none;
  }
  input::placeholder { color:#2a4a6a; }

  .btn-primary {
    background:linear-gradient(135deg,#00ffe7,#0060ff);
    border:none; border-radius:3px; padding:11px 22px;
    color:#000; font-family:monospace; font-weight:900;
    font-size:12px; letter-spacing:2px; cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-voice {
    background:linear-gradient(135deg,#7700ff,#0060ff);
    border:none; border-radius:3px; padding:10px 20px;
    color:#fff; font-family:monospace; font-weight:900;
    font-size:11px; letter-spacing:2px; cursor:pointer;
  }
  .btn-stop {
    background:#1a0408; border:2px solid #ff4455; border-radius:3px;
    padding:10px 20px; color:#ff4455; font-family:monospace;
    font-weight:900; font-size:11px; letter-spacing:2px; cursor:pointer;
  }
  .btn-outline {
    background:transparent; border:1px solid #00ffe733; border-radius:3px;
    padding:9px 16px; color:#00ffe7; font-family:monospace;
    font-size:10px; letter-spacing:2px; cursor:pointer;
  }
  .btn-settings {
    background:transparent; border:1px solid #00ffe744; border-radius:2px;
    padding:6px 14px; color:#00ffe7; font-family:monospace;
    font-size:10px; letter-spacing:2px; cursor:pointer;
  }

  .input-row { display:flex; gap:10px; flex-wrap:wrap; }
  .input-row input { flex:1; min-width:160px; }

  .progress {
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:4px; margin-bottom:18px;
    animation:fadeUp 0.4s ease;
  }
  .step-chip {
    padding:5px 13px; font-size:9px; letter-spacing:2px;
    border-radius:2px; font-weight:700; border:1px solid #1a2a3a;
    color:#2a4a6a; background:#060b14; transition:all 0.3s;
  }
  .step-chip.active { background:#0a1628; color:#00ffe7; border-color:#00ffe7; box-shadow:0 0 10px #00ffe788; }
  .step-chip.done { background:#00ffe7; color:#000; border-color:#00ffe7; }
  .step-line { width:18px; height:1px; background:#1a2a3a; }
  .step-line.done { background:#00ffe7; }

  .log-box {
    background:#04080f; border:1px solid #00ffe722;
    border-radius:4px; padding:12px; margin-bottom:18px;
    max-height:110px; overflow-y:auto; font-size:11px;
  }
  .log-line { margin-bottom:2px; line-height:1.6; }
  .log-time { color:#1a3a5a; margin-right:8px; }
  .log-info { color:#4a7fa5; }
  .log-success { color:#00ffe7; }
  .log-warn { color:#ffaa00; }
  .log-error { color:#ff4455; }
  .log-start { color:#aa44ff; }
  .cursor { color:#00ffe7aa; animation:blink 1s infinite; }

  .error-box {
    background:#1a0408; border:1px solid #ff445566;
    border-radius:4px; padding:12px; margin-bottom:18px;
    color:#ff6677; font-size:12px;
  }

  .title-bar {
    background:linear-gradient(90deg,#00ffe711,transparent);
    border:1px solid #00ffe733; border-radius:4px;
    padding:14px 18px; margin-bottom:16px; animation:fadeUp 0.5s ease;
  }
  .title-label { font-size:9px; letter-spacing:3px; color:#00ffe766; margin-bottom:5px; }
  .title-text { font-size:17px; font-weight:900; color:#e0f0ff; }

  .tabs { display:flex; gap:3px; border-bottom:1px solid #1a2a3a; flex-wrap:wrap; }
  .tab-btn {
    background:transparent; border:1px solid #1a2a3a;
    border-bottom:1px solid #1a2a3a; color:#4a7fa5;
    padding:7px 14px; font-size:9px; letter-spacing:2px;
    cursor:pointer; border-radius:2px 2px 0 0;
    font-family:monospace; font-weight:700;
    transform:translateY(1px); transition:all 0.2s;
  }
  .tab-btn.active {
    background:#0a1628; border-color:#00ffe7;
    border-bottom-color:#0a1628; color:#00ffe7;
  }
  .tab-content {
    background:#0a1628; border:1px solid #1a2a3a;
    border-top:none; border-radius:0 2px 6px 6px;
    padding:18px; margin-bottom:18px;
  }

  .voice-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .speaking-indicator { color:#00ffe7; font-size:11px; display:flex; align-items:center; gap:6px; }
  .speak-blink { animation:blink 0.5s infinite; font-size:15px; }
  .tts-tip {
    background:#060b14; border:1px solid #ffaa0033;
    border-radius:3px; padding:8px 12px; margin-bottom:12px;
    font-size:10px; color:#ffaa00; line-height:1.6;
  }
  .script-text {
    color:#c0d8f0; line-height:1.9; font-size:13px;
    white-space:pre-wrap; max-height:300px; overflow-y:auto;
  }

  .subtitle-line {
    display:flex; align-items:flex-start; gap:12px;
    background:#060b14; border-radius:2px; padding:9px 12px; margin-bottom:7px;
  }
  .sub-num { color:#00ffe744; font-size:9px; min-width:22px; font-weight:700; padding-top:2px; }
  .sub-text { color:#c0d8f0; font-size:12px; line-height:1.6; }

  .hashtag-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .hashtag {
    background:#060b14; border:1px solid #00ffe733;
    border-radius:2px; padding:5px 11px;
    color:#00ffe7; font-size:11px; font-weight:700;
  }

  .clips-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .clip-card { background:#060b14; border:1px solid #1a2a3a; border-radius:6px; overflow:hidden; }
  .clip-thumb { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .clip-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .play-overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.3);
  }
  .play-circle {
    width:36px; height:36px; border-radius:50%;
    background:rgba(0,255,231,0.85); display:flex;
    align-items:center; justify-content:center;
    font-size:13px; padding-left:3px; color:#000;
  }
  .clip-btns { padding:8px; display:flex; flex-direction:column; gap:5px; }
  .btn-open-video {
    display:block; text-align:center; background:linear-gradient(135deg,#00ffe7,#0060ff);
    color:#000; font-family:monospace; font-weight:900; font-size:9px;
    letter-spacing:1px; padding:7px; border-radius:2px; text-decoration:none;
  }
  .btn-pexels-page {
    display:block; text-align:center; background:transparent;
    border:1px solid #00ffe733; color:#00ffe7; font-family:monospace;
    font-size:9px; letter-spacing:1px; padding:6px; border-radius:2px; text-decoration:none;
  }
  .placeholder-label {
    text-align:center; color:#2a4a6a; font-size:9px; letter-spacing:1px; padding:7px;
  }

  .stack-bar { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .stack-item {
    background:#060b14; border:1px solid #1a2a3a;
    border-radius:3px; padding:8px 12px; flex:1; min-width:90px;
  }
  .stack-label { font-size:8px; letter-spacing:2px; color:#4a7fa5; margin-bottom:4px; }
  .stack-val { font-size:11px; font-weight:700; }

  #pexelsCredit {
    display:none; text-align:center; font-size:9px;
    color:#2a4a6a; letter-spacing:2px; margin-top:8px;
  }

  .settings-panel {
    display:none; background:#060b14; border:1px solid #00ffe733;
    border-radius:4px; padding:14px; margin-bottom:14px;
  }
  .settings-panel.open { display:block; }
  .settings-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .settings-row label { font-size:9px; letter-spacing:2px; color:#4a7fa5; min-width:80px; }
  .settings-row input { flex:1; min-width:140px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="wrap">

  <!-- Header -->
  <div style="margin-bottom:24px">
    <div class="badge">AI · VIDEO · GENERATOR</div>
    <h1>AI VIDEO GENERATOR</h1>
    <p class="subtitle">SCRIPT · VOICE · CLIPS · HASHTAGS · SUBTITLES</p>
  </div>

  <!-- Input -->
  <div class="card" id="inputCard">
    <label>VIDEO TOPIC</label>
    <div class="input-row">
      <input type="text" id="topicInput" placeholder="e.g. How AI is changing the world..." />
      <button class="btn-primary" id="genBtn" onclick="generate()">GENERATE ▶</button>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn-settings" onclick="toggleSettings()">⚙ SETTINGS</button>
      <span style="font-size:9px;color:#2a4a6a;letter-spacing:1px">ADD API KEYS FOR FULL FEATURES</span>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-row">
        <label>PEXELS KEY</label>
        <input type="password" id="pexelsKey" placeholder="Paste Pexels API key..." />
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress" id="progress" style="display:none">
    <div class="step-chip" id="step-script">SCRIPT</div>
    <div class="step-line" id="line-1"></div>
    <div class="step-chip" id="step-clips">CLIPS</div>
    <div class="step-line" id="line-2"></div>
    <div class="step-chip" id="step-render">RENDER</div>
    <div class="step-line" id="line-3"></div>
    <div class="step-chip" id="step-done">DONE</div>
  </div>

  <!-- Log -->
  <div class="log-box" id="logBox" style="display:none">
    <span class="cursor" id="cursor">█</span>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox" style="display:none"></div>

  <!-- Results -->
  <div id="results" style="display:none">
    <div class="title-bar">
      <div class="title-label">GENERATED TITLE</div>
      <div class="title-text" id="resultTitle"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('script',this)">SCRIPT</button>
      <button class="tab-btn" onclick="switchTab('subtitles',this)">SUBTITLES</button>
      <button class="tab-btn" onclick="switchTab('hashtags',this)">HASHTAGS</button>
      <button class="tab-btn" onclick="switchTab('clips',this)">CLIPS</button>
      <button class="tab-btn" onclick="switchTab('stack',this)">STACK</button>
    </div>

    <!-- Script tab -->
    <div class="tab-content" id="tab-script">
      <div class="tts-tip">⚡ TTS uses your browser's built-in voice engine. Works best in Chrome.</div>
      <div class="voice-row">
        <button class="btn-voice" id="playBtn" onclick="playVoice()">▶ PLAY VOICE</button>
        <button class="btn-stop" id="stopBtn" onclick="stopVoice()" style="display:none">■ STOP</button>
        <div class="speaking-indicator" id="speakIndicator" style="display:none">
          <span class="speak-blink">●</span> SPEAKING...
        </div>
        <button class="btn-outline" onclick="copyScript()">COPY SCRIPT</button>
      </div>
      <div class="script-text" id="scriptText"></div>
    </div>

    <!-- Subtitles tab -->
    <div class="tab-content" id="tab-subtitles" style="display:none">
      <div id="subtitlesList"></div>
    </div>

    <!-- Hashtags tab -->
    <div class="tab-content" id="tab-hashtags" style="display:none">
      <div class="hashtag-grid" id="hashtagGrid"></div>
      <button class="btn-outline" onclick="copyHashtags()">COPY ALL HASHTAGS</button>
    </div>

    <!-- Clips tab -->
    <div class="tab-content" id="tab-clips" style="display:none">
      <div style="font-size:9px;letter-spacing:2px;color:#4a7fa5;margin-bottom:12px" id="clipsLabel"></div>
      <div class="clips-grid" id="clipsGrid"></div>
      <div id="pexelsCredit">Videos provided by Pexels · pexels.com</div>
    </div>

    <!-- Stack tab -->
    <div class="tab-content" id="tab-stack" style="display:none">
      <div style="font-size:9px;letter-spacing:2px;color:#4a7fa5;margin-bottom:12px">TECH STACK</div>
      <div class="stack-bar" id="stackBar"></div>
    </div>
  </div>

</div>
<script>
const SYSTEM_PROMPT = `You are a viral short-form video script writer. Given a topic, return ONLY a valid JSON object with NO markdown, NO backticks, NO extra text.

JSON structure:
{
  "title": "catchy video title",
  "script": "full voiceover script 150-200 words, engaging and punchy",
  "subtitles": ["line 1","line 2","line 3",...],
  "hashtags": ["tag1","tag2",...],
  "searchQuery": "2-3 word Pexels video search query"
}`;

let currentResult = null;
let currentClips = [];
let isGenerating = false;
let isSpeaking = false;
let sentences = [];
let sentenceIdx = 0;
let resumeInterval = null;

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).style.display = 'block';
  btn.classList.add('active');
}

function setStep(step) {
  const steps = ['script','clips','render','done'];
  const idx = steps.indexOf(step);
  steps.forEach((s, i) => {
    const chip = document.getElementById('step-' + s);
    const line = document.getElementById('line-' + (i + 1));
    if (i < idx) { chip.className = 'step-chip done'; if (line) line.className = 'step-line done'; }
    else if (i === idx) { chip.className = 'step-chip active'; }
    else { chip.className = 'step-chip'; if (line) line.className = 'step-line'; }
  });
}

function addLog(msg, type) {
  const box = document.getElementById('logBox');
  box.style.display = 'block';
  const t = new Date().toLocaleTimeString('en',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const cursor = document.getElementById('cursor');
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">[${t}]</span><span class="log-${type}">${escHtml(msg)}</span>`;
  box.insertBefore(line, cursor);
  box.scrollTop = box.scrollHeight;
}

function setCursor(on) {
  document.getElementById('cursor').style.display = on ? 'inline' : 'none';
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  if (msg) { box.textContent = '⚠ ' + msg; box.style.display = 'block'; }
  else box.style.display = 'none';
}

function playVoice() {
  if (!currentResult) return;
  if (!('speechSynthesis' in window)) { alert('TTS not supported in this browser.'); return; }
  stopVoice();
  isSpeaking = true;
  sentences = currentResult.script.match(/[^.!?]+[.!?]+/g) || [currentResult.script];
  sentenceIdx = 0;
  document.getElementById('playBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'inline-block';
  document.getElementById('speakIndicator').style.display = 'flex';

  function speakNext() {
    if (!isSpeaking || sentenceIdx >= sentences.length) {
      if (sentenceIdx >= sentences.length) stopVoice();
      return;
    }
    const utt = new SpeechSynthesisUtterance(sentences[sentenceIdx++]);
    utt.rate = 1.05; utt.pitch = 1; utt.volume = 1;
    utt.onend = () => { if (isSpeaking) speakNext(); };
    utt.onerror = () => { if (isSpeaking) speakNext(); };
    speechSynthesis.speak(utt);
  }

  resumeInterval = setInterval(() => {
    if (!speechSynthesis.speaking && !speechSynthesis.pending && isSpeaking && sentenceIdx < sentences.length) {
      speakNext();
    }
  }, 2000);

  setTimeout(() => speakNext(), 150);
}

function stopVoice() {
  isSpeaking = false;
  clearInterval(resumeInterval);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  sentences = []; sentenceIdx = 0;
  document.getElementById('playBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('speakIndicator').style.display = 'none';
}

function copyScript() {
  if (currentResult) navigator.clipboard?.writeText(currentResult.script)
    .then(() => alert('Script copied!'));
}

function copyHashtags() {
  if (currentResult) navigator.clipboard?.writeText(
    (currentResult.hashtags || []).map(t => '#' + t).join(' ')
  ).then(() => alert('Hashtags copied!'));
}

async function generateScript(topic) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content: 'Topic: ' + topic }]
    })
  });
  if (!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  let text = data.content.map(b => b.text || '').join('');
  let clean = text.replace(/```json|```/g, '').trim();
  try { return JSON.parse(clean); } catch {
    addLog('Repairing JSON...', 'warn');
    const lb = clean.lastIndexOf('}');
    if (lb > 0) {
      let attempt = clean.substring(0, lb + 1);
      const opens = (attempt.match(/\[/g)||[]).length - (attempt.match(/\]/g)||[]).length;
      if (opens > 0) attempt = attempt.replace(/,?\s*$/, '') + ']'.repeat(opens) + '}';
      try { return JSON.parse(attempt); } catch {}
    }
    throw new Error('Invalid JSON from AI — please try again.');
  }
}

function makePlaceholders(query) {
  const s = encodeURIComponent(query);
  return [1,2,3,4].map(i => ({
    id: i, url: null, pexelsPage: null,
    thumb: `https://picsum.photos/seed/${s}${i}/400/225`
  }));
}

async function fetchClips(query, key) {
  if (!key) {
    addLog('No Pexels key — showing placeholders.', 'warn');
    return makePlaceholders(query);
  }
  addLog(`Searching Pexels: "${query}"...`, 'info');
  try {
    const res = await fetch(
      `https://api.pexels.com/v
