<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #060b14; color: #e0f0ff; font-family: monospace; padding: 20px; }
h1 { font-size: 24px; color: #00ffe7; margin-bottom: 20px; text-align: center; }
.card { background: #0a1628; border: 1px solid #00ffe744; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
label { display: block; font-size: 11px; color: #00ffe7; margin-bottom: 6px; letter-spacing: 2px; }
input { width: 100%; background: #060b14; border: 1px solid #00ffe733; border-radius: 4px; padding: 10px; color: #e0f0ff; font-family: monospace; font-size: 14px; margin-bottom: 10px; }
button { width: 100%; padding: 14px; border: none; border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
.btn-save { background: #ffaa00; color: #000; }
.btn-generate { background: #00ffe7; color: #000; }
.btn-generate:disabled { opacity: 0.4; }
.btn-play { background: #7700ff; color: #fff; }
.btn-stop { background: #1a0408; border: 2px solid #ff4455; color: #ff4455; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.pill { background: #060b14; border: 1px solid #00ffe733; border-radius: 20px; padding: 6px 14px; color: #4a7fa5; font-size: 11px; cursor: pointer; }
.pill.active { background: #00ffe722; border-color: #00ffe7; color: #00ffe7; }
.log { background: #04080f; border: 1px solid #00ffe722; border-radius: 4px; padding: 10px; margin-bottom: 16px; font-size: 11px; min-height: 60px; display: none; }
.error { background: #1a0408; border: 1px solid #ff4455; border-radius: 4px; padding: 12px; color: #ff6677; margin-bottom: 16px; display: none; }
.result-card { background: #0a1628; border: 1px solid #00ffe744; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: none; }
.result-title { font-size: 16px; font-weight: bold; color: #00ffe7; margin-bottom: 12px; }
.script-box { color: #c0d8f0; line-height: 1.8; font-size: 13px; white-space: pre-wrap; margin-bottom: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { background: #060b14; border: 1px solid #00ffe733; border-radius: 2px; padding: 4px 10px; color: #00ffe7; font-size: 11px; }
.clips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
.clip img { width: 100%; border-radius: 4px; aspect-ratio: 16/9; object-fit: cover; }
.clip a { display: block; text-align: center; background: #00ffe7; color: #000; padding: 6px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: bold; margin-top: 4px; }
.section-title { font-size: 10px; letter-spacing: 2px; color: #00ffe7; margin: 12px 0 8px; }
.copy-btn { background: transparent; border: 1px solid #00ffe733; color: #00ffe7; width: auto; padding: 8px 16px; font-size: 10px; margin-top: 8px; }
.voice-row { display: flex; gap: 8px; margin-bottom: 12px; }
.voice-row button { width: auto; padding: 10px 18px; font-size: 11px; }
.speaking { color: #00ffe7; font-size: 11px; margin-bottom: 8px; display: none; }
</style>
</head>
<body>
<h1>⚡ AI VIDEO GENERATOR</h1>

<div class="card">
  <label>GROQ API KEY (FREE)</label>
  <input type="password" id="groqKey" placeholder="gsk_..." />
  <label>PEXELS API KEY (FREE)</label>
  <input type="password" id="pexelsKey" placeholder="Pexels key..." />
  <button class="btn-save" onclick="saveKeys()">SAVE KEYS ✓</button>
  <div id="keyStatus" style="color:#00ffe7;font-size:11px;display:none">✓ Keys saved!</div>
</div>

<div class="card">
  <label>VIDEO TOPIC</label>
  <input type="text" id="topic" placeholder="e.g. Romans 10:9-10..." />
  <label>STYLE</label>
  <div class="pills">
    <div class="pill active" onclick="pickPill(this,'style')">MOTIVATIONAL</div>
    <div class="pill" onclick="pickPill(this,'style')">EDUCATIONAL</div>
    <div class="pill" onclick="pickPill(this,'style')">STORYTELLING</div>
    <div class="pill" onclick="pickPill(this,'style')">FUNNY</div>
  </div>
  <label>LENGTH</label>
  <div class="pills">
    <div class="pill" onclick="pickPill(this,'length')">30 SEC</div>
    <div class="pill active" onclick="pickPill(this,'length')">60 SEC</div>
    <div class="pill" onclick="pickPill(this,'length')">3 MIN</div>
    <div class="pill" onclick="pickPill(this,'length')">5 MIN</div>
  </div>
  <button class="btn-generate" id="genBtn" onclick="generate()">GENERATE ▶</button>
</div>

<div class="log" id="log"></div>
<div class="error" id="error"></div>

<div class="result-card" id="results">
  <div class="result-title" id="resultTitle"></div>

  <div class="section-title">SCRIPT</div>
  <div class="script-box" id="scriptBox"></div>

  <div class="section-title">VOICE</div>
  <div class="speaking" id="speaking">● SPEAKING...</div>
  <div class="voice-row">
    <button class="btn-play" id="playBtn" onclick="playVoice()">▶ PLAY VOICE</button>
    <button class="btn-stop" id="stopBtn" onclick="stopVoice()" style="display:none">■ STOP</button>
  </div>
  <button class="copy-btn" onclick="copyText('scriptBox')">COPY SCRIPT</button>

  <div class="section-title">HASHTAGS</div>
  <div class="tags" id="tagsBox"></div>
  <button class="copy-btn" onclick="copyTags()">COPY HASHTAGS</button>

  <div class="section-title">VIDEO CLIPS (PEXELS)</div>
  <div class="clips" id="clipsBox"></div>
</div>

<script>
var groqKey = '';
var pexelsKey = '';
var style = 'MOTIVATIONAL';
var length = '60 SEC';
var busy = false;
var speaking = false;
var sentences = [];
var sentenceIdx = 0;
var resumeTimer = null;

window.onload = function() {
  try {
    var gk = localStorage.getItem('groq_key');
    var pk = localStorage.getItem('pexels_key');
    if (gk) { document.getElementById('groqKey').value = gk; groqKey = gk; }
    if (pk) { document.getElementById('pexelsKey').value = pk; pexelsKey = pk; }
    if (gk) { document.getElementById('keyStatus').style.display = 'block'; }
  } catch(e) {}
};

function saveKeys() {
  var gk = document.getElementById('groqKey').value.trim();
  var pk = document.getElementById('pexelsKey').value.trim();
  if (!gk) { alert('Please enter your Groq API key!'); return; }
  groqKey = gk;
  pexelsKey = pk;
  try {
    localStorage.setItem('groq_key', gk);
    localStorage.setItem('pexels_key', pk);
  } catch(e) {}
  var s = document.getElementById('keyStatus');
  s.style.display = 'block';
  s.textContent = '✓ Keys saved!';
  setTimeout(function() { s.style.display = 'none'; }, 3000);
}

function pickPill(el, group) {
  var pills = el.parentNode.getElementsByClassName('pill');
  for (var i = 0; i < pills.length; i++) pills[i].classList.remove('active');
  el.classList.add('active');
  if (group === 'style') style = el.textContent;
  if (group === 'length') length = el.textContent;
}

function addLog(msg) {
  var box = document.getElementById('log');
  box.style.display = 'block';
  box.innerHTML += '<div>▶ ' + msg + '</div>';
  box.scrollTop = box.scrollHeight;
}

function showError(msg) {
  var box = document.getElementById('error');
  box.style.display = 'block';
  box.textContent = '⚠ ' + msg;
}

function copyText(id) {
  var text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(function() { alert('Copied!'); });
}

function copyTags() {
  var tags = document.getElementById('tagsBox').querySelectorAll('.tag');
  var text = Array.from(tags).map(function(t) { return t.textContent; }).join(' ');
  navigator.clipboard.writeText(text).then(function() { alert('Copied!'); });
}

function playVoice() {
  var script = document.getElementById('scriptBox').textContent;
  if (!script) return;
  if (!('speechSynthesis' in window)) { alert('Voice not supported in this browser.'); return; }
  stopVoice();
  speaking = true;
  sentences = script.match(/[^.!?]+[.!?]+/g) || [script];
  sentenceIdx = 0;
  document.getElementById('playBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'inline-block';
  document.getElementById('speaking').style.display = 'block';

  function speakNext() {
    if (!speaking || sentenceIdx >= sentences.length) {
      if (sentenceIdx >= sentences.length) stopVoice();
      return;
    }
    var utt = new SpeechSynthesisUtterance(sentences[sentenceIdx++]);
  utt.rate = 1.05;
var voices = speechSynthesis.getVoices();
var maleVoice = voices.find(function(v) {
  return v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('james') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('guy');
});
if (maleVoice) utt.voice = maleVoice;
    utt.pitch = 1;
    utt.volume = 1;
    utt.onend = function() { if (speaking) speakNext(); };
    utt.onerror = function() { if (speaking) speakNext(); };
    speechSynthesis.speak(utt);
  }

  resumeTimer = setInterval(function() {
    if (!speechSynthesis.speaking && !speechSynthesis.pending && speaking && sentenceIdx < sentences.length) {
      speakNext();
    }
  }, 2000);

  setTimeout(function() { speakNext(); }, 150);
}

function stopVoice() {
  speaking = false;
  clearInterval(resumeTimer);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  sentences = [];
  sentenceIdx = 0;
  document.getElementById('playBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('speaking').style.display = 'none';
}

function getWordCount() {
  if (length === '30 SEC') return '75-90';
  if (length === '3 MIN') return '450-500';
  if (length === '5 MIN') return '700-750';
  return '150-180';
}

function getStylePrompt() {
  if (style === 'EDUCATIONAL') return 'Clear and informative educational tone.';
  if (style === 'STORYTELLING') return 'Compelling narrative story format.';
  if (style === 'FUNNY') return 'Fun and humorous tone with wit.';
  return 'Energetic and motivational tone.';
}

async function generate() {
  if (busy) return;
  var topic = document.getElementById('topic').value.trim();
  if (!topic) { alert('Please enter a topic!'); return; }
  if (!groqKey) { alert('Please enter your Groq key and tap SAVE KEYS first!'); return; }

  busy = true;
  stopVoice();
  document.getElementById('log').innerHTML = '';
  document.getElementById('error').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('genBtn').disabled = true;
  document.getElementById('genBtn').textContent = 'WORKING...';
  addLog('Starting: ' + topic);

  try {
    addLog('Calling Groq AI...');
    var prompt = 'You are a viral video script writer. ' + getStylePrompt() + ' Return ONLY a valid JSON object with no markdown and no backticks. Use this exact structure: {"title":"video title","script":"script text ' + getWordCount() + ' words","hashtags":["tag1","tag2","tag3"],"searchQuery":"2 word search"}. Topic: ' + topic;

    var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + groqKey
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 8000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      var err = await res.json();
      throw new Error(err.error ? err.error.message : 'Groq error ' + res.status);
    }

    var data = await res.json();
    var text = data.choices[0].message.content;
    var clean = text.replace(/```json|```/g, '').trim();
    var result = JSON.parse(clean);
    addLog('Script ready!');

    document.getElementById('resultTitle').textContent = result.title;
    document.getElementById('scriptBox').textContent = result.script;
    document.getElementById('tagsBox').innerHTML = (result.hashtags || []).map(function(t) {
      return '<div class="tag">#' + t + '</div>';
    }).join('');

    if (pexelsKey) {
      addLog('Fetching Pexels clips...');
      try {
        var pr = await fetch('https://api.pexels.com/videos/search?query=' + encodeURIComponent(result.searchQuery || topic) + '&per_page=20', {
          headers: { Authorization: pexelsKey }
        });
        var pdata = await pr.json();
        document.getElementById('clipsBox').innerHTML = (pdata.videos || []).map(function(v) {
          var file = v.video_files && v.video_files[0];
          return '<div class="clip"><img src="' + v.image + '" loading="lazy" />' + (file ? '<a href="' + file.link + '" target="_blank">▶ WATCH</a>' : '') + '</div>';
        }).join('');
        addLog('Clips loaded!');
      } catch(e) {
        addLog('Pexels failed: ' + e.message);
      }
    } else {
      document.getElementById('clipsBox').innerHTML = '<p style="color:#4a7fa5;font-size:11px">Add Pexels key for video clips</p>';
    }

    document.getElementById('results').style.display = 'block';
    addLog('Done! ✓');

  } catch(e) {
    showError(e.message);
  }

  busy = false;
  document.getElementById('genBtn').disabled = false;
  document.getElementById('genBtn').textContent = 'GENERATE ▶';
}
</script>
</body>
</html>
